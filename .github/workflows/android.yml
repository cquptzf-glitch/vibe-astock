name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-mvp
    paths:
      - "desktop/**"
      - "core-rust/**"
      - "src-tauri/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NDK_VERSION: "27.2.12479018"
      ANDROID_RELEASE_TAG: "android-mvp-v0.1.7"
      ANDROID_APK_NAME: "vibe-astock-android-mvp-v0.1.7-arm64.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}-1

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Typecheck and build frontend
        run: npm run build --prefix desktop

      - name: Test Rust core
        run: cargo test --manifest-path core-rust/Cargo.toml

      - name: Initialize Android project
        run: cargo tauri android init --ci

      - name: Build installable APK
        run: cargo tauri android build --ci --debug --apk --target aarch64

      - name: Prepare and verify APK
        shell: bash
        run: |
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Android APK was not produced" >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/${ANDROID_APK_NAME}"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/${ANDROID_APK_NAME}"
          sha256sum "dist/${ANDROID_APK_NAME}" > "dist/${ANDROID_APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-astock-android-mvp-v0.1.7-arm64
          path: |
            dist/${{ env.ANDROID_APK_NAME }}
            dist/${{ env.ANDROID_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android MVP prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-android]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          ## Vibe AStock Android MVP v0.1.7

          Eighth installable Android MVP built from the `android-mvp` branch.

          ### New in v0.1.7
          - Adds A-share symbol search directly in the Android Rust Core using Tencent Smartbox
          - Search supports stock code, Chinese name and pinyin; no Node/Python service is required
          - Mobile quote page now shows debounced search suggestions and opens a selected result directly
          - Search results are restricted to Shanghai/Shenzhen A-share stocks, excluding indexes, funds and overseas securities
          - Exact 6-digit stock codes still open directly without waiting for a suggestion request
          - Adds fixture-based Rust tests for Smartbox parsing and runs `cargo test` in Android CI before packaging

          ### Already included
          - Market overview and breadth
          - Limit-up pool and consecutive-limit ladder with latest-trading-day fallback
          - Concept/industry rotation with today vs. 5-day fund-flow observation labels
          - Realtime stock quote with Tencent primary source and Eastmoney fallback
          - Forward-adjusted K-line data and enhanced stock detail analysis
          - Local SQLite watchlist and editable Trading Journal with appendable fills
          - Local journal performance/discipline/risk dashboard
          - Opt-in OpenAI-compatible AI journal review with payload preview and aggregate-only default scope

          ### Security note
          - Model credentials remain in Android app-private SQLite and are never echoed back through the mobile API
          - Changing the AI Base URL clears an existing credential unless a replacement key is explicitly supplied
          - Android Keystore migration remains a production-hardening task after the MVP feature pass

          ### Installation
          - Android 7.0+ (minSdk 24)
          - ARM64 devices only in this MVP build
          - Direct sideload APK; this is a debug-signed prerelease for functional testing, not a Google Play production build

          The `.sha256` file is provided for download integrity verification.
          EOF
          )

          # Re-publishing the same MVP version after a fix must also retarget the tag.
          # Upload --clobber alone would leave the tag pointing at the older commit.
          if gh release view "$ANDROID_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$ANDROID_RELEASE_TAG" --cleanup-tag --yes
          fi

          gh release create "$ANDROID_RELEASE_TAG" \
            "dist/${ANDROID_APK_NAME}" \
            "dist/${ANDROID_APK_NAME}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Vibe AStock Android MVP v0.1.7" \
            --notes "$NOTES" \
            --prerelease

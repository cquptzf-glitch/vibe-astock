name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-mvp
    paths:
      - "desktop/**"
      - "core-rust/**"
      - "src-tauri/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NDK_VERSION: "27.2.12479018"
      ANDROID_RELEASE_TAG: "android-mvp-v0.1.9"
      ANDROID_APK_NAME: "vibe-astock-android-mvp-v0.1.9-arm64.apk"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}-1

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Typecheck and build frontend
        run: npm run build --prefix desktop

      - name: Test Rust core
        run: cargo test --manifest-path core-rust/Cargo.toml

      - name: Initialize Android project
        run: cargo tauri android init --ci

      - name: Build installable size-optimized APK
        # Keep the Android debug signing path for sideloadable CI artifacts, while
        # src-tauri/Cargo.toml strips/optimizes the Rust dev profile aggressively.
        run: cargo tauri android build --ci --debug --apk --split-per-abi --target aarch64

      - name: Prepare, inspect and verify APK
        shell: bash
        run: |
          APK="src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*arm64*.apk' -print | sort | awk 'NR == 1 { print }')"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Android ARM64 APK was not produced" >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 7 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/${ANDROID_APK_NAME}"

          SIZE_BYTES="$(stat -c%s "dist/${ANDROID_APK_NAME}")"
          SIZE_MIB="$(awk -v bytes="$SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"
          echo "APK size: ${SIZE_BYTES} bytes (${SIZE_MIB} MiB)"

          APK_ENTRIES="$(unzip -l "dist/${ANDROID_APK_NAME}" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ { print $1, $4 }' | sort -nr | awk 'NR <= 20 { print }')"
          {
            echo "## Android APK size"
            echo ""
            echo "- File: \`${ANDROID_APK_NAME}\`"
            echo "- Size: **${SIZE_MIB} MiB** (${SIZE_BYTES} bytes)"
            echo ""
            echo "### Largest uncompressed APK entries"
            echo '```text'
            printf '%s\n' "$APK_ENTRIES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Largest APK entries:"
          printf '%s\n' "$APK_ENTRIES"

          if [ "$SIZE_BYTES" -gt 83886080 ]; then
            echo "::warning::APK remains larger than 80 MiB; inspect the size report above."
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/${ANDROID_APK_NAME}"
          sha256sum "dist/${ANDROID_APK_NAME}" > "dist/${ANDROID_APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-astock-android-mvp-v0.1.9-arm64
          path: |
            dist/${{ env.ANDROID_APK_NAME }}
            dist/${{ env.ANDROID_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android MVP prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-android]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES=$(cat <<'EOF'
          ## Vibe AStock Android MVP v0.1.9

          Tenth installable Android MVP built from the `android-mvp` branch.

          ### New in v0.1.9
          - Unifies stock routing behind one Rust `SymbolKey` contract across quote, K-line, search and watchlist storage
          - Adds Beijing Stock Exchange routing alongside Shanghai and Shenzhen: SH / SZ / BJ
          - Supports BSE code segments including 43 / 83 / 87 / 92 and preserves the migrated legacy parity contract
          - Removes the duplicate quote-side `SymbolInfo` parser so Tencent and Eastmoney cannot silently disagree on market routing
          - Parses and validates a symbol once at the `/fetch` boundary; contradictory market spellings now return HTTP 400
          - Extends Tencent Smartbox search to accept BSE A-share results when exchange and code segment agree
          - Validates and canonicalizes watchlist symbols with the same shared router
          - Updates the Android stock UI to accept `BJ430047` and `430047.BJ` and label SH/SZ/BJ consistently
          - Keeps the optimized ARM64 sideload build and APK size report introduced in v0.1.8

          ### Already included
          - Market overview and breadth
          - Limit-up pool and consecutive-limit ladder with latest-trading-day fallback
          - Concept/industry rotation with today vs. 5-day fund-flow observation labels
          - Realtime stock quote with Tencent primary source and Eastmoney fallback
          - Forward-adjusted K-line data and enhanced stock detail analysis
          - Code / Chinese-name / pinyin symbol search
          - Local SQLite watchlist and editable Trading Journal with appendable fills
          - Local portfolio derived from journal fills with realtime quote refresh
          - Local journal performance/discipline/risk dashboard
          - Local daily review and OpenAI-compatible AI chat/review flows
          - Settings/data summary view for local storage and credential status

          ### Build and security note
          - CI artifacts remain debug-signed so they are directly installable without committing a production signing key
          - Rust native code is stripped and size-optimized even in this test-signing build
          - Production distribution will use the release Android variant with a persistent private signing certificate
          - Model credentials remain in Android app-private SQLite; Android Keystore migration is still production hardening work

          ### Installation
          - Android 7.0+ (minSdk 24)
          - ARM64 devices only
          - Direct sideload APK intended for functional testing

          The `.sha256` file is provided for download integrity verification.
          EOF
          )

          if gh release view "$ANDROID_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$ANDROID_RELEASE_TAG" --cleanup-tag --yes
          fi

          gh release create "$ANDROID_RELEASE_TAG" \
            "dist/${ANDROID_APK_NAME}" \
            "dist/${ANDROID_APK_NAME}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Vibe AStock Android MVP v0.1.9" \
            --notes "$NOTES" \
            --prerelease

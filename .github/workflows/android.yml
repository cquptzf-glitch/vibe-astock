name: Android CI APK

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish verified APK as a GitHub prerelease
        type: boolean
        default: true
  push:
    branches:
      - android-mvp
    paths:
      - "desktop/**"
      - "core-rust/**"
      - "scripts/android/**"
      - "datasources/rss_sources.json"
      - "src-tauri/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    outputs:
      app_version: ${{ steps.app-version.outputs.app_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: app-version
        shell: bash
        run: |
          APP_VERSION="$(python3 - <<'PY'
          import pathlib
          import tomllib
          import json

          with pathlib.Path("src-tauri/Cargo.toml").open("rb") as handle:
              version = tomllib.load(handle)["package"]["version"]
          if json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"] != version:
              raise SystemExit("Tauri Android version must match Cargo before building")
          print(version)
          PY
          )"
          if [ -z "$APP_VERSION" ]; then
            echo "Unable to resolve src-tauri package version" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "ANDROID_APK_NAME=vibe-astock-android-mvp-v${APP_VERSION}-arm64.apk" >> "$GITHUB_ENV"
          echo "Resolved Android app version: $APP_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Setup Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Check Rust formatting and lints
        run: |
          cargo fmt --all --manifest-path core-rust/Cargo.toml -- --check
          cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path core-rust/Cargo.toml --lib --tests -- -D warnings

      - name: Test Rust core
        run: |
          python3 -m unittest discover -s scripts/android/tests -v
          python3 core-rust/tests/generate_calc_parity.py --check
          cargo test --locked --manifest-path core-rust/Cargo.toml

      - name: Cache Tauri CLI
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-v2-${{ runner.os }}-${{ runner.arch }}-1

      - name: Install Tauri CLI
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Install shared test dependencies
        run: npm ci --prefix orchestrator

      - name: Typecheck and build frontend
        run: npm run build --prefix desktop

      - name: Test frontend
        run: npm test --prefix desktop

      - name: Build standalone mobile frontend
        run: npm run build:mobile --prefix desktop

      - name: Verify compact and light mobile UI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-ui" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/mobile-ui/node_modules/.bin/playwright" install --with-deps chromium
          npm run preview:mobile --prefix desktop -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/mobile-ui-server.log" 2>&1 &
          UI_SERVER_PID=$!
          trap 'kill "$UI_SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173 > /dev/null; then break; fi
            sleep 1
          done
          VIBE_UI_RUNTIME="$RUNNER_TEMP/mobile-ui" VIBE_UI_OUTPUT="dist/mobile-ui" node desktop/test/mobile-ui-smoke.mjs

      - name: Upload mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-astock-mobile-ui-v${{ env.APP_VERSION }}
          path: dist/mobile-ui
          if-no-files-found: warn
          retention-days: 30

      - name: Initialize Android project
        run: cargo tauri android init --ci

      - name: Restore preview upgrade signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-preview-debug-keystore-v1

      - name: Guard preview upgrade identity
        run: python3 scripts/android/prepare_preview_signing.py

      - name: Build installable size-optimized APK
        # CI keeps the Android debug signing path so artifacts remain directly
        # installable. Production signing is handled separately from this job.
        run: cargo tauri android build --ci --debug --apk --split-per-abi --target aarch64

      - name: Test native reminder navigation
        working-directory: src-tauri/gen/android
        run: ./gradlew :tauri-plugin-vibe-reminders:testDebugUnitTest

      - name: Verify release APK and AAB with a disposable test key
        run: python3 scripts/android/smoke_distribution.py

      - name: Upload distribution verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: android-distribution-smoke-receipt
          path: dist/android-distribution-smoke/verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Prepare, inspect and verify APK
        shell: bash
        run: |
          APK="src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*arm64*.apk' -print | sort | awk 'NR == 1 { print }')"
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "Android ARM64 APK was not produced" >&2
            find src-tauri/gen/android/app/build/outputs -maxdepth 7 -type f -print || true
            exit 1
          fi

          mkdir -p dist
          cp "$APK" "dist/${ANDROID_APK_NAME}"

          SIZE_BYTES="$(stat -c%s "dist/${ANDROID_APK_NAME}")"
          SIZE_MIB="$(awk -v bytes="$SIZE_BYTES" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')"
          echo "APK size: ${SIZE_BYTES} bytes (${SIZE_MIB} MiB)"

          APK_ENTRIES="$(unzip -l "dist/${ANDROID_APK_NAME}" | awk 'NF >= 4 && $1 ~ /^[0-9]+$/ { print $1, $4 }' | sort -nr | awk 'NR <= 20 { print }')"
          {
            echo "## Android APK size"
            echo ""
            echo "- Version: \`${APP_VERSION}\`"
            echo "- File: \`${ANDROID_APK_NAME}\`"
            echo "- Size: **${SIZE_MIB} MiB** (${SIZE_BYTES} bytes)"
            echo ""
            echo "### Largest uncompressed APK entries"
            echo '```text'
            printf '%s\n' "$APK_ENTRIES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_BYTES" -gt 83886080 ]; then
            echo "::warning::APK remains larger than 80 MiB; inspect the size report above."
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "dist/${ANDROID_APK_NAME}"
          python3 scripts/android/verify_distribution.py --preview-receipt dist/preview-signing.json --apk "dist/${ANDROID_APK_NAME}" --apksigner "$APKSIGNER" --version "$APP_VERSION" --output dist/preview-apk-verification.json
          sha256sum "dist/${ANDROID_APK_NAME}" > "dist/${ANDROID_APK_NAME}.sha256"

      - name: Upload public preview signing receipt
        uses: actions/upload-artifact@v4
        with:
          name: preview-signing-receipt
          path: |
            dist/preview-signing.json
            dist/preview-apk-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-astock-android-mvp-v${{ env.APP_VERSION }}-arm64
          path: |
            dist/${{ env.ANDROID_APK_NAME }}
            dist/${{ env.ANDROID_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    needs: build-apk
    if: github.ref == 'refs/heads/android-mvp' && (github.event_name == 'push' || inputs.publish_preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: vibe-astock-android-mvp-v${{ needs.build-apk.outputs.app_version }}-arm64
          path: dist
      - name: Publish Android preview
        uses: actions/github-script@v7
        env:
          APP_VERSION: ${{ needs.build-apk.outputs.app_version }}
        with:
          script: |
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const { owner, repo } = context.repo;
            const version = process.env.APP_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Invalid app version");
            const tag = "android-mvp-v" + version;
            const filename = "vibe-astock-android-mvp-v" + version + "-arm64.apk";
            const apk = fs.readFileSync("dist/" + filename);
            const checksum = fs.readFileSync("dist/" + filename + ".sha256", "utf8");
            const digest = crypto.createHash("sha256").update(apk).digest("hex");
            if (checksum.trim().split(/\s+/)[0] !== digest) throw new Error("APK SHA256 mismatch");
            const notes = fs.readFileSync("docs/android/releases/" + version + ".md", "utf8");
            // Version tags are immutable: never retarget or replace a published package.
            let existing;
            try { existing = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (existing) {
              if (existing.target_commitish !== context.sha || existing.draft ||
                  !existing.assets.some(a => a.name === filename) ||
                  !existing.assets.some(a => a.name === filename + ".sha256")) {
                throw new Error("Release version already exists with a different or incomplete snapshot; bump version");
              }
              await core.summary.addLink("Existing Android preview", existing.html_url).write();
              return;
            }
            try {
              const ref = (await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag })).data;
              if (ref.object.type !== "commit" || ref.object.sha !== context.sha) {
                throw new Error("Tag exists at a different revision; bump version");
              }
            } catch (error) { if (error.status !== 404) throw error; }
            const runUrl = context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId;
            const body = notes + "\n\n代码提交：" + context.sha + "\n\n构建验证：" + runUrl +
              "\n\nAPK SHA256：\x60" + digest + "\x60\n";
            const release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: context.sha,
              name: "Vibe AStock Android v" + version + " 预览版",
              body, draft: true, prerelease: true
            })).data;
            for (const [name, data, type] of [
              [filename, apk, "application/vnd.android.package-archive"],
              [filename + ".sha256", Buffer.from(checksum), "text/plain"]
            ]) {
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { "content-type": type, "content-length": data.length }
              });
            }
            const published = (await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: "false"
            })).data;
            await core.summary.addLink("Download Android preview", published.html_url).write();

name: Repository traffic

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-traffic.yml'
      - 'scripts/traffic/**'
  pull_request:
    paths:
      - '.github/workflows/repository-traffic.yml'
      - 'scripts/traffic/**'

permissions:
  contents: read

concurrency:
  group: repository-traffic-${{ github.event_name == 'pull_request' && github.ref || 'updates' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate traffic merging, SVG and failure handling
        run: python -m unittest discover -s scripts/traffic -p 'test_*.py' -v

  collect:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check traffic credential
        id: credential
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$TRAFFIC_TOKEN" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Configure the TRAFFIC_TOKEN repository secret (Administration: read) to enable real traffic collection.'
            echo '### Traffic collection is not enabled' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add TRAFFIC_TOKEN in repository Settings → Secrets and variables → Actions, then run this workflow again. No traffic data was collected or changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credential.outputs.ready == 'true'
        with:
          ref: traffic-data
          path: .traffic-data
          fetch-depth: 1
      - name: Fetch GitHub traffic and render chart
        if: steps.credential.outputs.ready == 'true'
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python scripts/traffic/repository_traffic.py --output .traffic-data
      - name: Publish updated archive and chart
        if: steps.credential.outputs.ready == 'true'
        working-directory: .traffic-data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic.json traffic.svg
          if git diff --cached --quiet; then
            echo 'No traffic changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'chore: update repository traffic'
          git push origin HEAD:traffic-data
          echo 'Updated traffic-data/traffic.svg and traffic.json from GitHub aggregate statistics.' >> "$GITHUB_STEP_SUMMARY"

[package]
name = "vibe-astock-mobile"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vibe_astock_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
vibe-astock-core = { path = "../core-rust" }

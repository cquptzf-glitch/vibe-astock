[package]
name = "vibe-astock-mobile"
version = "0.1.45"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vibe_astock_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-vibe-reminders = { path = "tauri-plugin-vibe-reminders" }
tauri-plugin-vibe-secure-storage = { path = "tauri-plugin-vibe-secure-storage" }
tauri-plugin-vibe-share = { path = "tauri-plugin-vibe-share" }
vibe-astock-core = { path = "../core-rust" }

[profile.dev]
opt-level = "s"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release]
opt-level = "s"
debug = 0
strip = "symbols"
codegen-units = 1
lto = true
panic = "abort"

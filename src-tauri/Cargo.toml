[package]
name = "vibe-astock-mobile"
version = "0.1.10"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "vibe_astock_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-vibe-secure-storage = { path = "tauri-plugin-vibe-secure-storage" }
vibe-astock-core = { path = "../core-rust" }

# Android MVP artifacts are debug-signed for direct sideloading in CI, but the
# Rust native library does not need debug symbols. Keep it small and close to
# release-code characteristics without committing a production signing key.
[profile.dev]
opt-level = "s"
debug = 0
strip = "symbols"
incremental = false
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.release]
opt-level = "s"
debug = 0
strip = "symbols"
codegen-units = 1
lto = true
panic = "abort"

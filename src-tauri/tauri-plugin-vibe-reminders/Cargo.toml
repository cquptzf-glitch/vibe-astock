[package]
name = "tauri-plugin-vibe-reminders"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-vibe-reminders"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

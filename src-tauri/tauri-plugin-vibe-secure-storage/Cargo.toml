[package]
name = "tauri-plugin-vibe-secure-storage"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-vibe-secure-storage"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"
thiserror = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "2", features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 占位:真正的标题由组装根按注册进来的垂类品牌名写入(见 main.tsx)。
         🔴 别在这里写死栏目名 —— 这是 Core 的壳,换个行业不该改它。 -->
    <title>Vibe AStock</title>
    <!-- 首帧就按上次选择上色,避免深色用户先闪一下白屏(令牌默认是浅色) -->
    <script>
      try {
        var t = localStorage.getItem("vra-theme");
        var mobile = Boolean(window.__TAURI__ || window.__TAURI_INTERNALS__);
        var theme = t === "light" || t === "dark" ? t : t === "system" || mobile ? "system" : "dark";
        var resolved = theme === "system" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : theme;
        document.documentElement.dataset.theme = resolved;
        if (mobile) {
          document.documentElement.style.colorScheme = resolved;
          document.documentElement.classList.toggle("light", resolved === "light");
          document.documentElement.dataset.mobileDensity = localStorage.getItem("vibe.mobile.density") === "comfortable" ? "comfortable" : "compact";
        }
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Tauri 环境先安装 /api -> IPC 兼容桥；普通浏览器中它是 no-op。 -->
    <script type="module" src="/src/mobileBridge.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[package]
name = "vibe-astock-core"
version = "0.1.39"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
html-escape = "0.2"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "charset", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
crc32fast = "1"
flate2 = "1"
scraper = "0.24"
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }
pdf-extract = "0.10"
calamine = { version = "0.36", default-features = false }
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "sync", "net", "io-util"] }

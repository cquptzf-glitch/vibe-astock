[package]
name = "vibe-astock-core"
version = "0.1.26"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
html-escape = "0.2"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.36", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
